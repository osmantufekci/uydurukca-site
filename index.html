<!doctype html>
<html lang="tr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>uydurukça</title>
<meta name="description" content="Türkçede adı olmayan anlara uydurulmuş kelimeler. Her gün 07:00 ve 19:00'da bir yenisi.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Courier+Prime&family=Fraunces:opsz,wght@9..144,600;9..144,700&family=Source+Serif+4:ital,opsz,wght@0,8..60,400;0,8..60,600;1,8..60,400&display=swap">
<style>
/* Botun paylaşım görseliyle aynı dil (renderer.py): kâğıt, mürekkep, kırmızı yıldız.
   Kartlar sözlükçülerin fişleri: 5×3 inç, mavi satır çizgileri, kırmızı başlık çizgisi. */
:root {
  --paper: #F3EDDD;
  --ink: #1D1A15;
  --secondary: #4A4337;
  --muted: #6F6656;
  --accent: #B3372B;
  --rule: rgba(31, 92, 140, 0.22);
  --rule-red: rgba(179, 55, 43, 0.55);
  --ground: #E2DAC6;
  --ground-ink: #1D1A15;
  --ground-muted: #6A6150;
  --edge: rgba(29, 26, 21, 0.12);
  --shadow: 0 1px 1px rgba(29, 26, 21, 0.08), 0 10px 24px -10px rgba(29, 26, 21, 0.30);
  --focus: #1F5C8C;
  --display: "Fraunces", "Iowan Old Style", Georgia, serif;
  --text: "Source Serif 4", "Iowan Old Style", Georgia, serif;
  --type: "Courier Prime", "Courier New", monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --ground: #1B1814;
    --ground-ink: #EFE8D6;
    --ground-muted: #A39984;
    --edge: rgba(0, 0, 0, 0.4);
    --shadow: 0 1px 1px rgba(0, 0, 0, 0.4), 0 14px 32px -12px rgba(0, 0, 0, 0.75);
    --focus: #8DB8DD;
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --ground: #1B1814;
  --ground-ink: #EFE8D6;
  --ground-muted: #A39984;
  --edge: rgba(0, 0, 0, 0.4);
  --shadow: 0 1px 1px rgba(0, 0, 0, 0.4), 0 14px 32px -12px rgba(0, 0, 0, 0.75);
  --focus: #8DB8DD;
  color-scheme: dark;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  background: var(--ground);
  color: var(--ground-ink);
  font: 400 16px/1.5 var(--text);
  padding-inline: 20px;
  display: flex;
  flex-direction: column;
  min-height: 100vh;
}
a { color: inherit; }
:focus-visible { outline: 2px solid var(--focus); outline-offset: 3px; border-radius: 3px; }

.top, footer {
  width: 100%;
  max-width: 960px;
  margin-inline: auto;
}
.top { padding-block: 26px 0; }
.brand { font: 700 22px/1 var(--display); letter-spacing: -0.01em; margin: 0; }
.star { color: var(--accent); }
.brand .star { font-size: 0.8em; vertical-align: 0.45em; margin-left: 1px; }

main {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 30px;
  padding-block: 48px 40px;
}

/* --- deste --- */
.deck {
  display: grid;
  width: min(100%, 420px);
  cursor: pointer;
}
.card {
  --r: 6.4cqi; /* satır aralığı: bütün satır yükseklikleri bunun katı */
  grid-area: 1 / 1;
  container-type: inline-size;
  position: relative;
}
.face {
  aspect-ratio: 5 / 3;
  background:
    linear-gradient(to bottom, transparent calc(var(--r) * 1.6 - 1px), var(--rule-red) calc(var(--r) * 1.6 - 1px), var(--rule-red) calc(var(--r) * 1.6 + 1px), transparent calc(var(--r) * 1.6 + 1px)),
    repeating-linear-gradient(to bottom, transparent 0 calc(var(--r) - 1px), var(--rule) calc(var(--r) - 1px) var(--r)) 0 calc(var(--r) * 0.6) / 100% 100% no-repeat,
    var(--paper);
  color: var(--ink);
  border: 1px solid var(--edge);
  border-radius: 3px;
  box-shadow: var(--shadow);
  padding: calc(var(--r) * 0.6) 6cqi calc(var(--r) * 0.9);
  display: flex;
  flex-direction: column;
  transform-origin: 30% 100%;
  transition: transform 560ms cubic-bezier(.2, .8, .2, 1), opacity 300ms ease;
}
/* Katalog fişinin altındaki çubuk deliği */
.face::after {
  content: "";
  position: absolute;
  left: 50%;
  bottom: calc(var(--r) * 0.35);
  width: 3.6cqi;
  height: 3.6cqi;
  margin-left: -1.8cqi;
  border-radius: 50%;
  background: var(--ground);
  box-shadow: inset 0 1px 2px rgba(29, 26, 21, 0.35);
}
.card[data-pos="0"] { z-index: 4; }
.card[data-pos="1"] { z-index: 3; }
.card[data-pos="2"] { z-index: 2; }
.card[data-pos="rest"] { z-index: 1; }
.card[data-pos="out"] { z-index: 5; }
.card[data-pos="1"] .face { transform: translate(-1.8%, 4%) rotate(-2.2deg); }
.card[data-pos="2"] .face { transform: translate(2%, 7%) rotate(1.7deg); }
.card[data-pos="rest"] .face { transform: translate(0, 9%) rotate(0.3deg); opacity: 0; }
.card[data-pos="out"] .face { transform: translate(8%, -118%) rotate(-5deg); }
.card:not([data-pos="0"]):not([data-pos="out"]) .face > * { visibility: hidden; }

.meta {
  display: flex;
  justify-content: space-between;
  font: 400 3.3cqi/var(--r) var(--type);
  color: var(--muted);
  height: calc(var(--r) * 1.6);
  align-items: center;
  font-variant-numeric: tabular-nums;
}
.head {
  display: flex;
  flex-wrap: wrap;
  align-items: baseline;
  column-gap: 2.6cqi;
  margin-top: calc(var(--r) * 0.25);
}
.word {
  font: 600 min(8.4cqi, calc(118cqi / var(--n, 8)))/calc(var(--r) * 1.75) var(--display);
  letter-spacing: -0.012em;
  margin: 0;
}
.word .star { font-size: 0.6em; vertical-align: 0.7em; }
.reading { margin: 0; color: var(--secondary); font-size: 3.6cqi; line-height: var(--r); }
.reading i { margin-left: 0.3em; }
.def { margin: 0; font-size: 4.1cqi; line-height: var(--r); }
.ex { margin: 0; color: var(--secondary); font-style: italic; font-size: 3.7cqi; line-height: var(--r); }
.foot { margin: auto 0 0; font-size: 3cqi; line-height: var(--r); color: var(--accent); }

/* --- denetim --- */
.controls {
  display: flex;
  align-items: center;
  gap: 6px 14px;
  flex-wrap: wrap;
  justify-content: center;
  font-size: 15px;
  color: var(--ground-muted);
}
.controls button {
  font: 400 20px/1 var(--text);
  color: var(--ground-ink);
  background: transparent;
  border: 0;
  width: 36px;
  height: 36px;
  border-radius: 50%;
  cursor: pointer;
}
.controls button:hover { background: var(--edge); }
.count { font: 400 14px/1 var(--type); min-width: 4.2em; text-align: center; font-variant-numeric: tabular-nums; }
.open-x { margin-left: 10px; }
.open-x:hover { color: var(--ground-ink); }
.empty { color: var(--ground-muted); font-style: italic; text-align: center; }

footer {
  padding-block: 0 26px;
  display: flex;
  justify-content: space-between;
  flex-wrap: wrap;
  gap: 4px 24px;
  font-size: 14px;
  color: var(--ground-muted);
}
footer p { margin: 0; }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip-path: inset(50%); white-space: nowrap; }

@media (prefers-reduced-motion: reduce) {
  .face { transition: none; }
}
</style>
</head>
<body>
<header class="top">
  <p class="brand">uydurukça<span class="star">*</span></p>
</header>

<main>
  <section class="deck" id="deck" aria-roledescription="deste" aria-label="Paylaşılan kelimeler"></section>
  <div class="controls" id="controls" hidden>
    <button type="button" id="prev" aria-label="Önceki kelime">‹</button>
    <span class="count" id="count" aria-hidden="true"></span>
    <button type="button" id="next" aria-label="Sonraki kelime">›</button>
    <a class="open-x" id="open-x" href="https://x.com/UydurukcaSozluk" rel="noopener">X'te aç</a>
  </div>
  <p class="sr" id="live" aria-live="polite"></p>
</main>

<footer>
  <p>Her gün 07:00 ve 19:00'da yeni bir kelime.</p>
  <p>X'te <a href="https://x.com/UydurukcaSozluk" rel="noopener">@UydurukcaSozluk</a> · Instagram'da da.</p>
</footer>

<script id="kelimeler" type="application/json">[{"kelime": "saklutmak", "hece": "sak·lut·mak", "tur": "f.", "tanim": "Bir eşyayı kaybetmemek amacıyla fazla güvenli bir yere koyup o yeri sonradan hatırlayamamak.", "ornek": "Pasaportu saklutmuşum, çekmeceleri tek tek açıp duruyorum.", "x": "2105731785686450245", "tarih": "2026-10-01T18:49:15.345764+00:00"}, {"kelime": "nakaratlanmak", "hece": "na·ka·rat·lan·mak", "tur": "f.", "tanim": "Bir şarkının küçük bir bölümünün duyulduktan sonra gün boyu zihinde kendiliğinden tekrar tekrar çalması.", "ornek": "Markette duyduğum reklam müziğine akşama kadar nakaratlandım, bir türlü kurtulamadım.", "x": "2105642367139172382", "tarih": "2026-10-01T12:53:56.238389+00:00"}, {"kelime": "uykukavgas", "hece": "uy·ku·kav·gas", "tur": "a.", "tanim": "Bir tartışmadan çok sonra, o anda söylenememiş en etkili cevabı zihinde kurup pişmanlıkla tekrarlamak.", "ornek": "Duşta hâlâ uykukavgas kuruyordum, dün patrona diyecektim de diyemedim.", "x": "2105500644161339704", "tarih": "2026-10-01T03:30:46.951146+00:00"}, {"kelime": "çentelemek", "hece": "çen·te·le·mek", "tur": "f.", "tanim": "Bir sözü anlamadığını art arda söylemekten utanıp anlamış gibi sıkıntılı bir gülümsemeyle geçiştirmek.", "ornek": "Kalabalık kafede ne dediğini duymadım ama çenteleyip başımı salladım.", "x": "2105325149461344678", "tarih": "2026-09-30T15:53:25.747595+00:00"}, {"kelime": "hazıntılamak", "hece": "ha·zın·tı·la·mak", "tur": "f.", "tanim": "Asıl işe başlamadan önce ortamı kusursuz hale getirmekle vakit geçirip işi sürekli ertelemek.", "ornek": "Rapor yazmak yerine yine hazıntıladım, üç saat kalem dizdim.", "x": "2105314664116539437", "tarih": "2026-09-30T15:11:45.776111+00:00"}, {"kelime": "harfçamak", "hece": "harf·ça·mak", "tur": "f.", "tanim": "Telefonun şarjı bitmek üzereyken yazıyı kısaltıp her harfi ve her işlemi idareli harcamak.", "ornek": "Şarj yüzde üçe düşünce harfçadım, anneme sadece “geliyom” yazabildim.", "x": "2105282459285721180", "tarih": "2026-09-30T13:03:47.588600+00:00"}, {"kelime": "fırtıldamak", "hece": "fır·tıl·da·mak", "tur": "f.", "tanim": "Yeni açılan kasaya ya da boşluğa, uzun süredir bekleyenleri geride bırakarak ani bir hamleyle öne geçmek.", "ornek": "Yan kasa açılınca arkamdakiler fırtıldadı, ben yine en sona kaldım.", "x": "2105225658121044075", "tarih": "2026-09-30T09:18:05.100291+00:00"}, {"kelime": "adıştırmak", "hece": "a·dış·tır·mak", "tur": "f.", "tanim": "Adını unuttuğu birine, bunu belli etmemek için sohbet boyunca adını hiç anmadan ustaca geçiştirmek.", "ornek": "Düğünde eski komşuya yarım saat “canım” deyip adıştırdım, tanıştırma anında terledim.", "x": "2105081947579982196", "tarih": "2026-09-29T23:47:01.767401+00:00"}, {"kelime": "buyburunlaşmak", "hece": "buy·bu·run·laş·mak", "tur": "f.", "tanim": "Karşılaşan iki kişinin birbirine yol vermek isterken aynı anda aynı yöne kayıp birbirini tıkaması.", "ornek": "Market koridorunda yaşlı bir teyzeyle üç kez buyburunlaştık, sonunda ikimiz de güldük.", "x": "2105039098809385304", "tarih": "2026-09-29T20:56:45.832462+00:00"}]</script>
<script>
(() => {
  const words = JSON.parse(document.getElementById("kelimeler").textContent || "[]");
  const deck = document.getElementById("deck");
  const count = document.getElementById("count");
  const live = document.getElementById("live");
  const openX = document.getElementById("open-x");
  const reduce = matchMedia("(prefers-reduced-motion: reduce)");
  const AUTO_MS = 6000;
  const LEAVE_MS = 360;

  if (!words.length) {
    deck.outerHTML = '<p class="empty">İlk kelime yakında burada.</p>';
    return;
  }

  const dateFmt = new Intl.DateTimeFormat("tr-TR", {
    day: "numeric", month: "long", year: "numeric", timeZone: "Europe/Istanbul",
  });

  function el(tag, cls, text) {
    const node = document.createElement(tag);
    if (cls) node.className = cls;
    if (text != null) node.textContent = text;
    return node;
  }

  // En yenisi en üstte; numara paylaşım sırasını verir (ilk kelime № 1).
  const cards = words.map((w, i) => {
    const card = el("article", "card");
    card.setAttribute("aria-roledescription", "fiş");
    const face = el("div", "face");
    const meta = el("div", "meta");
    meta.append(el("span", null, "№ " + (words.length - i)), el("span", null, dateFmt.format(new Date(w.tarih))));
    const head = el("div", "head");
    const word = el("h2", "word", w.kelime);
    word.style.setProperty("--n", Math.max(w.kelime.length, 7));
    word.append(el("span", "star", "*"));
    const reading = el("p", "reading", w.hece);
    if (w.tur) reading.append(el("i", null, w.tur));
    head.append(word, reading);
    face.append(meta, head, el("p", "def", "1. " + w.tanim), el("p", "ex", "— " + w.ornek),
      el("p", "foot", "* uydurma kelimedir"));
    card.append(face);
    deck.append(card);
    return card;
  });

  let order = cards.map((_, i) => i);
  let busy = false;

  function layout() {
    order.forEach((index, pos) => {
      const card = cards[index];
      card.dataset.pos = pos < 3 ? String(pos) : "rest";
      card.inert = pos !== 0;
      card.setAttribute("aria-hidden", String(pos !== 0));
    });
    const current = order[0];
    count.textContent = (current + 1) + " / " + words.length;
    openX.href = "https://x.com/UydurukcaSozluk/status/" + words[current].x;
    live.textContent = words[current].kelime;
  }

  // Üstteki fiş yukarı çekilir, destenin arkasına sokulur.
  function next() {
    if (busy) return;
    const top = cards[order[0]];
    if (reduce.matches || cards.length === 1) {
      order.push(order.shift());
      return layout();
    }
    busy = true;
    top.dataset.pos = "out";
    setTimeout(() => {
      order.push(order.shift());
      layout();
      setTimeout(() => { busy = false; }, 200);
    }, LEAVE_MS);
  }

  function prev() {
    if (busy) return;
    const card = cards[order[order.length - 1]];
    order.unshift(order.pop());
    if (reduce.matches || cards.length === 1) return layout();
    busy = true;
    const face = card.firstChild;
    face.style.transition = "none";
    card.dataset.pos = "out";
    face.offsetWidth; // yukarıdan başlasın
    face.style.transition = "";
    layout();
    setTimeout(() => { busy = false; }, LEAVE_MS);
  }

  // Kendiliğinden döner; üzerine gelince ya da sekme gizliyken durur.
  let holdUntil = 0;
  function hold() { holdUntil = Date.now() + AUTO_MS * 2; }
  if (!reduce.matches && cards.length > 1) {
    setInterval(() => {
      if (Date.now() >= holdUntil && !deck.matches(":hover") && !document.hidden) next();
    }, AUTO_MS);
  }

  document.getElementById("next").addEventListener("click", () => { hold(); next(); });
  document.getElementById("prev").addEventListener("click", () => { hold(); prev(); });
  deck.addEventListener("click", () => { hold(); next(); });
  document.addEventListener("keydown", (e) => {
    if (e.key === "ArrowRight") { hold(); next(); }
    if (e.key === "ArrowLeft") { hold(); prev(); }
  });
  let touchX = null;
  deck.addEventListener("touchstart", (e) => { touchX = e.touches[0].clientX; }, { passive: true });
  deck.addEventListener("touchend", (e) => {
    if (touchX == null) return;
    const dx = e.changedTouches[0].clientX - touchX;
    touchX = null;
    if (Math.abs(dx) > 40) { hold(); dx < 0 ? next() : prev(); }
  });

  document.getElementById("controls").hidden = cards.length < 2;
  layout();
})();
</script>
</body>
